<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="mountGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="mountGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background with subtle rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer glowing border -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#38BDF8" stroke-opacity="0.3" stroke-width="4"/>

  <!-- Ambient Glow Behind Peaks -->
  <circle cx="256" cy="240" r="140" fill="url(#glowGrad)"/>

  <!-- Left Mountain Peak -->
  <polygon points="90,360 210,180 310,360" fill="url(#mountGrad2)" opacity="0.9"/>
  <!-- Right Higher Mountain Peak with Snowcap -->
  <polygon points="190,360 320,120 440,360" fill="url(#mountGrad1)" filter="url(#neonGlow)"/>
  <!-- Mountain Highlights -->
  <polygon points="320,120 350,175 320,195 295,170" fill="#FFFFFF" opacity="0.95"/>
  <polygon points="210,180 230,215 210,230 195,210" fill="#FFFFFF" opacity="0.85"/>

  <!-- Android / Download Arrow Modern Crest in Center Base -->
  <g transform="translate(256, 380) scale(1.3)" text-anchor="middle">
    <!-- Badge Pill -->
    <rect x="-85" y="-30" width="170" height="42" rx="21" fill="#0B132B" stroke="#06B6D4" stroke-width="3"/>
    <text x="0" y="-3" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" letter-spacing="2">
      HOUSNI<tspan fill="#06B6D4"> APK</tspan>
    </text>
  </g>
</svg>
